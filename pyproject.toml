[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "graphragprov"
version = "0.1.0"
description = "Text-grounded provenance for graph-based multi-hop question answering."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Wadie El Amrani", email = "elamraniwadie99@gmail.com" }
]

keywords = [
    "graph-rag",
    "provenance",
    "knowledge-graphs",
    "sparql",
    "multi-hop-question-answering",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0",
    "rdflib>=7.3,<8",
]

[project.urls]
Repository = "https://github.com/wadie999/graphragprov"
Issues = "https://github.com/wadie999/graphragprov/issues"


[project.scripts]
graphragprov = "graphragprov.cli.main:main"


[project.optional-dependencies]
api = [
    "fastapi>=0.139,<1",
    "uvicorn[standard]>=0.51,<1",
]

dev = [
    "build>=1.2",
    "httpx>=0.28,<1",
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "external",
    "build",
    "dist",
    "runs",
]


[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
pretty = true
